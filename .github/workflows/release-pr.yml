---
name: Create Release PR

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'バージョンの上げ幅'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions: {}

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          echo "previous=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          npm version "$BUMP" --no-git-tag-version
          version="$(jq -r .version package.json)"
          sed -i -E "s#(yujideveloper/action-holiday-jp-with-additional-holidays@)v[0-9]+\.[0-9]+\.[0-9]+#\1v${version}#g" README.md
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ steps.bump.outputs.version }}
          PREVIOUS: ${{ steps.bump.outputs.previous }}
        run: |
          branch="chore/bump-version-to-${VERSION}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "chore: bump version to ${VERSION}"
          git push origin "$branch"
          notes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="v${VERSION}" \
            -f target_commitish="$GITHUB_REF_NAME" \
            -f previous_tag_name="v${PREVIOUS}" \
            --jq .body)"
          body="$(printf 'v%s → v%s（%s） リリース\n\n%s\n' "$PREVIOUS" "$VERSION" "$BUMP" "$notes")"
          gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$branch" \
            --title "chore: bump version to ${VERSION}" \
            --body "$body"
